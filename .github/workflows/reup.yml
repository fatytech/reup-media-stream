name: Media Stream Reup Pilot

on:
  schedule:
    - cron: '15 23 * * *'  # 06:15 GMT+7
    - cron: '15 14 * * *'  # 21:15 GMT+7
  workflow_dispatch:        # Manual trigger

jobs:
  reup:
    runs-on: ubuntu-latest
    concurrency:
      group: reup
      cancel-in-progress: false  # queue instead of cancel
    permissions:
      contents: write       # Required to commit DB back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0    # Full history needed for rebase

      # Pull DB mới nhất trước khi chạy
      # (phòng trường hợp có run khác đã push DB sau lần checkout này)
      - name: Pull latest DB
        run: git pull --rebase origin main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reup session
        env:
          PYTHONUNBUFFERED: "1"
          LOG_STDOUT: "true"   # tắt log stdout trên public repo; đổi thành "true" để debug
          VPS_ID: ${{ secrets.VPS_ID }}
          APPSCRIPT_URL: ${{ secrets.APPSCRIPT_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        run: python -m src.main

      - name: Push DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No DB changes, skipping push." && exit 0
          git commit -m "chore: update upload history db [skip ci]"
          git push
